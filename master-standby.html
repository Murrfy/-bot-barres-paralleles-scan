<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zenith — MASTER Standby</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 48px}.card{background:#0c1a2b;border:1px solid #29415d;border-radius:22px;padding:22px}
h1{font-size:30px;margin:0 0 8px}.sub{color:#a9bdd3;margin-bottom:20px;line-height:1.45}
.status{padding:16px;border-radius:14px;background:#07111f;border:1px solid #29415d;line-height:1.5;margin-top:12px}
.ok{border-color:#168d5d;color:#9bf0c3}.err{border-color:#a53b3b;color:#ffb1b1}.warn{border-color:#7b5b18;color:#ffe6a3}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Zenith — MASTER Standby</h1>
    <div class="sub">Préparation technique uniquement. Cette page n’envoie aucun ordre Binance.</div>
    <div id="identity" class="status">Vérification de l’identité…</div>
    <div id="state" class="status">Vérification de l’état central…</div>
    <div id="preflight" class="status">Pré-contrôle de sécurité…</div>
    <div id="lease" class="status warn">Le bail MASTER n’est pas demandé automatiquement sur cette page.</div>
  </div>
</div>
<script>
const TOKEN_KEY='zenith_device_token_v1';

function box(id,msg,type=''){
  const e=document.getElementById(id);e.textContent=msg;e.className='status'+(type?' '+type:'');
}

(async()=>{
  const token=localStorage.getItem(TOKEN_KEY)||'';
  if(!token){
    box('identity','Aucun jeton MASTER trouvé dans ce navigateur.','err');
    box('state','État central non vérifié.','err');
    return;
  }
  try{
    const r=await fetch('/api/zenith-sync?action=whoami',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});
    const q=await r.json().catch(()=>({}));
    if(!r.ok||q?.ok!==true||q?.device?.role!=='master') throw new Error(q?.code||q?.error||('ROLE_'+String(q?.device?.role||'UNKNOWN')));
    box('identity','Identité vérifiée : cet appareil est enregistré comme MASTER.','ok');

    const sr=await fetch('/api/zenith-sync?action=controller-state',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});
    const sq=await sr.json().catch(()=>({}));
    if(sr.ok&&sq?.ok===true&&sq?.state){
      box('state','État central lisible · révision '+String(sq.state.revision||0)+'.','ok');
    }else if(sr.ok&&sq?.ok===true){
      box('state','État central accessible, mais aucun état contrôleur n’est encore présent.','warn');
    }else{
      box('state','État central non vérifié : '+String(sq?.code||sq?.error||('HTTP '+sr.status))+'.','err');
    }

    const pr=await fetch('/api/zenith-sync?action=master-preflight',{
      headers:{Authorization:'Bearer '+token,Accept:'application/json'},
      cache:'no-store'
    });
    const pq=await pr.json().catch(()=>({}));
    if(!pr.ok||pq?.ok!==true){
      box('preflight','Pré-contrôle refusé : '+String(pq?.code||pq?.error||('HTTP '+pr.status))+'.','err');
    }else if(pq.readyForStandby===true){
      box(
        'preflight',
        'Pré-contrôle OK : trading réel verrouillé · arrêt sécurité actif · état central révision '+
          String(pq.controllerRevision||0)+' · aucun conflit MASTER.',
        'ok'
      );
    }else{
      box('preflight','Pré-contrôle non prêt : '+String((pq.reasons||[]).join(', ')||'raison inconnue')+'.','warn');
    }
  }catch(e){
    box('identity','Vérification MASTER refusée : '+String(e?.message||'erreur')+'.','err');
    box('state','État central non vérifié.','err');
    box('preflight','Pré-contrôle non vérifié.','err');
  }
})();
</script>
</body>
</html>
