<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zenith — Vérification iPhone</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef6ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07111f}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 48px}
.card{background:#0c1a2b;border:1px solid #29415d;border-radius:22px;padding:22px}
h1{font-size:30px;margin:0 0 8px}.sub{color:#a9bdd3;margin-bottom:20px;line-height:1.45}
.status{padding:16px;border-radius:14px;background:#07111f;border:1px solid #29415d;line-height:1.5}
.ok{border-color:#168d5d;color:#9bf0c3}.err{border-color:#a53b3b;color:#ffb1b1}.warn{border-color:#7b5b18;color:#ffe6a3}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Zenith — vérification contrôleur</h1>
    <div class="sub">Cette page vérifie que cet appareil est bien reconnu par le serveur comme contrôleur et non comme MASTER.</div>
    <div id="status" class="status">Vérification en cours…</div>
    <div id="cloud" class="status" style="margin-top:12px">Vérification de la synchronisation centrale…</div>
    <div id="safety" class="status" style="margin-top:12px">Vérification des verrous de sécurité…</div>
    <div id="reconcile" class="status" style="margin-top:12px">Réconciliation Binance en lecture seule…</div>
  </div>
</div>
<script>
const TOKEN_KEY='zenith_device_token_v1';
const ROLE_KEY='zenith_device_role_v1';
const NAME_KEY='zenith_device_name_v1';

function show(msg,type=''){const e=document.getElementById('status');e.textContent=msg;e.className='status'+(type?' '+type:'')}

(async()=>{
  const token=localStorage.getItem(TOKEN_KEY)||'';
  const localRole=localStorage.getItem(ROLE_KEY)||'';
  if(!token){show('Aucun jeton de jumelage trouvé dans ce navigateur.','err');return}
  try{
    const r=await fetch('/api/zenith-sync?action=whoami',{
      headers:{Authorization:'Bearer '+token,Accept:'application/json'},
      cache:'no-store'
    });
    const q=await r.json().catch(()=>({}));
    if(!r.ok||q?.ok!==true||!q?.device) throw new Error(q?.code||q?.error||('HTTP '+r.status));
    if(q.device.role!=='controller') throw new Error('ROLE_INATTENDU_'+String(q.device.role||''));
    localStorage.setItem(ROLE_KEY,'controller');
    if(q.device.deviceName) localStorage.setItem(NAME_KEY,q.device.deviceName);
    show('Vérifié : cet iPhone est reconnu par le serveur comme CONTRÔLEUR. Il n’est pas MASTER.','ok');
    try{
      const sr=await fetch('/api/zenith-sync?action=controller-state',{
        headers:{Authorization:'Bearer '+token,Accept:'application/json'},
        cache:'no-store'
      });
      const sq=await sr.json().catch(()=>({}));
      const cloud=document.getElementById('cloud');
      if(sr.ok&&sq?.ok===true&&sq?.state){
        cloud.textContent='Synchronisation centrale OK · révision '+String(sq.state.revision||0)+'.';
        cloud.className='status ok';
      }else if(sr.ok&&sq?.ok===true&&!sq?.state){
        cloud.textContent='Synchronisation centrale prête, mais aucun état iPhone n’a encore été enregistré.';
        cloud.className='status';
      }else{
        cloud.textContent='Synchronisation centrale non vérifiée : '+String(sq?.code||sq?.error||('HTTP '+sr.status))+'.';
        cloud.className='status err';
      }
    }catch(se){
      const cloud=document.getElementById('cloud');
      cloud.textContent='Synchronisation centrale inaccessible : '+String(se?.message||'erreur')+'.';
      cloud.className='status err';
    }

    try{
      const rr=await fetch('/api/zenith-sync?action=safety',{
        headers:{Authorization:'Bearer '+token,Accept:'application/json'},
        cache:'no-store'
      });
      const rq=await rr.json().catch(()=>({}));
      const safety=document.getElementById('safety');
      if(!rr.ok||rq?.ok!==true){
        throw new Error(rq?.code||rq?.error||('HTTP '+rr.status));
      }

      const locked = rq.realTradingEnabled !== true && rq.executionMode === 'SIMULATION_LOCKED';
      const emergencyStop = rq.emergencyStopActive === true;
      const noMasterLease = rq.masterLeaseActive !== true;
      const noMasterRegistered = rq.masterRegistered !== true;

      safety.textContent =
        'Sécurité : trading réel '+(locked?'VERROUILLÉ':'NON VERROUILLÉ')+
        ' · arrêt sécurité '+(emergencyStop?'ACTIF':'INACTIF')+
        ' · iPad MASTER '+(noMasterRegistered?'non enregistré':'enregistré')+
        ' · bail MASTER '+(noMasterLease?'inactif':'ACTIF')+
        ' · commandes '+String(rq.pendingCommands||0)+' en attente / '+String(rq.processingCommands||0)+' en traitement.';

      safety.className='status '+(locked&&emergencyStop&&noMasterLease?'ok':'warn');
    }catch(se){
      const safety=document.getElementById('safety');
      safety.textContent='État sécurité non vérifié : '+String(se?.message||'erreur')+'.';
      safety.className='status err';
    }

    try{
      const br=await fetch('/api/binance-reconcile',{
        headers:{Authorization:'Bearer '+token,Accept:'application/json'},
        cache:'no-store'
      });
      const bq=await br.json().catch(()=>({}));
      const reconcile=document.getElementById('reconcile');

      if(!br.ok||bq?.ok!==true||!bq?.report){
        throw new Error(bq?.code||bq?.error||('HTTP '+br.status));
      }

      const report=bq.report;
      const actualPositions=Number(report?.actual?.positions||0);
      const actualOrders=Number(report?.actual?.orders||0);
      const reasons=Array.isArray(report?.reasons)?report.reasons:[];

      if(report.failClosed===true){
        reconcile.textContent=
          'Réconciliation Binance BLOQUANTE · positions réelles '+actualPositions+
          ' · ordres ouverts '+actualOrders+
          ' · écarts : '+(reasons.join(', ')||'inconnus')+'.';
        reconcile.className='status err';
      }else{
        reconcile.textContent=
          'Réconciliation Binance OK · positions réelles '+actualPositions+
          ' · ordres ouverts '+actualOrders+
          ' · aucun écart détecté.';
        reconcile.className='status ok';
      }
    }catch(se){
      const reconcile=document.getElementById('reconcile');
      reconcile.textContent='Réconciliation Binance non vérifiée : '+String(se?.message||'erreur')+'.';
      reconcile.className='status err';
    }
  }catch(e){
    show('Vérification refusée : '+(e?.message||'erreur inconnue')+'.','err');
  }
})();
</script>
</body>
</html>
