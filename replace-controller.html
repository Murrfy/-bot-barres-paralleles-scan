<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zenith — Remplacer l’iPhone</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
.card{background:#0c1a2b;border:1px solid #29415d;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:30px;margin:0 0 8px}.sub{color:#a9bdd3;margin-bottom:20px;line-height:1.45}
label{display:block;font-weight:700;margin:16px 0 8px}
input{width:100%;font-size:19px;padding:15px 14px;border-radius:14px;border:1px solid #35516f;background:#07111f;color:#fff;outline:none}
button,.link{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#16a3c7;color:#041018;text-align:center;text-decoration:none}
button:disabled{opacity:.5}
.status{margin-top:18px;padding:14px;border-radius:14px;background:#07111f;border:1px solid #29415d;line-height:1.45}
.ok{border-color:#168d5d;color:#9bf0c3}.err{border-color:#a53b3b;color:#ffb1b1}
.small{font-size:13px;color:#9db0c4;margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Zenith — nouvel iPhone</h1>
    <div class="sub">Cette procédure remplace l’ancien iPhone contrôleur sans toucher au MASTER ni aux positions Binance.</div>

    <label for="recoveryCode">Code temporaire affiché sur l’iPad MASTER</label>
    <input id="recoveryCode" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX">

    <button id="replaceBtn">Remplacer l’ancien iPhone</button>

    <div id="status" class="status">Prêt.</div>
    <a id="openBot" class="link" href="/" hidden>Ouvrir Zenith</a>
    <div class="small">Après validation, l’ancien iPhone est automatiquement refusé par le serveur. Les réglages centraux sont récupérés avant l’ouverture du bot.</div>
  </div>
</div>
<script>
const DEVICE_ID_KEY='zenith_device_id_v1';
const DEVICE_TOKEN_KEY='zenith_device_token_v1';
const DEVICE_ROLE_KEY='zenith_device_role_v1';
const DEVICE_NAME_KEY='zenith_device_name_v1';
const REV_KEY='zenith_controller_revision_v1';
const STORAGE_KEY='zenith_final3_v3_20260921';
const REPLACEMENT_DEVICE_ID_KEY='zenith_replacement_device_id_v1';

const $=id=>document.getElementById(id);
const setStatus=(msg,type='')=>{
  const el=$('status');
  el.textContent=msg;
  el.className='status'+(type?' '+type:'');
};

function replacementDeviceId(){
  let id=localStorage.getItem(REPLACEMENT_DEVICE_ID_KEY);
  if(!id){
    id='iphone-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
    localStorage.setItem(REPLACEMENT_DEVICE_ID_KEY,id);
  }
  return id;
}

function restoreCentralState(state){
  if(!state||typeof state!=='object'||!state.data||typeof state.data!=='object') return false;

  const d=state.data;
  const recovered={
    settings:d.settings&&typeof d.settings==='object'?d.settings:{},
    tokenSettings:d.tokenSettings&&typeof d.tokenSettings==='object'?d.tokenSettings:{},
    manualTokens:d.manualTokens&&typeof d.manualTokens==='object'?d.manualTokens:{},
    validated:d.validated&&typeof d.validated==='object'?d.validated:{},
    revalidateBlock:{},
    missedSignals:{},
    openPositions:[],
    history:[],
    dismissed:{},
    selectedSymbol:''
  };

  localStorage.setItem(STORAGE_KEY,JSON.stringify(recovered));
  localStorage.setItem(REV_KEY,String(Number(state.revision||0)));
  return true;
}

async function replaceController(){
  const recoveryCode=$('recoveryCode').value.trim();
  if(!recoveryCode){
    setStatus('Entre le code temporaire affiché sur l’iPad.','err');
    return;
  }

  $('replaceBtn').disabled=true;
  setStatus('Remplacement sécurisé en cours…');

  try{
    const newDeviceId=replacementDeviceId();
    const r=await fetch('/api/zenith-sync?action=controller-replacement-redeem',{
      method:'POST',
      headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({
        recoveryCode,
        deviceId:newDeviceId,
        deviceName:'iPhone contrôleur Zenith'
      })
    });

    const q=await r.json().catch(()=>({}));
    if(!r.ok||q?.ok!==true||!q?.token||!q?.device){
      throw new Error(q?.code||q?.error||('HTTP '+r.status));
    }

    localStorage.setItem(DEVICE_ID_KEY,newDeviceId);
    localStorage.setItem(DEVICE_TOKEN_KEY,q.token);
    localStorage.setItem(DEVICE_ROLE_KEY,'controller');
    localStorage.setItem(DEVICE_NAME_KEY,'iPhone contrôleur Zenith');
    localStorage.removeItem(REPLACEMENT_DEVICE_ID_KEY);

    const restored=restoreCentralState(q.state);
    $('recoveryCode').value='';

    setStatus(
      'Nouvel iPhone activé. Ancien iPhone révoqué.'+
      (restored?' Réglages centraux restaurés · révision '+String(q.state.revision||0)+'.':''),
      'ok'
    );
    $('openBot').hidden=false;
  }catch(e){
    setStatus('Remplacement refusé : '+String(e?.message||'erreur inconnue')+'.','err');
  }finally{
    $('replaceBtn').disabled=false;
  }
}

$('replaceBtn').addEventListener('click',replaceController);
$('recoveryCode').addEventListener('keydown',e=>{if(e.key==='Enter')replaceController()});
</script>
</body>
</html>
