name: Zenith Safety Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check secret hygiene
        run: node scripts/check-secret-hygiene.mjs
      - name: Check dangerous runtime primitives
        run: node scripts/check-dangerous-runtime-primitives.mjs
      - name: Check full Git history for secrets
        run: node scripts/check-secret-history.mjs
      - name: Check zero third-party dependency surface
        run: node scripts/check-dependency-surface.mjs
      - name: Check HTML and safety invariants
        run: node scripts/check-zenith.mjs
      - name: Test API error sanitization
        run: node --test scripts/test-api-error-sanitization.mjs
      - name: Test audit secret hygiene
        run: node --test scripts/test-audit-secret-hygiene.mjs
      - name: Check Binance read API syntax
        run: node --check api/binance-read.js
      - name: Check Binance reconciliation API syntax
        run: node --check api/binance-reconcile.js
      - name: Check Binance entry preflight API syntax
        run: node --check api/binance-entry-preflight.js
      - name: Check fail-closed Binance entry execution API syntax
        run: node --check api/binance-entry-execute.js
      - name: Check protective execution API syntax
        run: node --check api/binance-protective-execute.js
      - name: Check protective update execution API syntax
        run: node --check api/binance-protective-update-execute.js
      - name: Check Binance user-stream session API syntax
        run: node --check api/binance-user-stream-session.js
      - name: Check Binance runtime snapshot API syntax
        run: node --check api/binance-runtime-snapshot.js
      - name: Check Binance protective test-order API syntax
        run: node --check api/binance-order-test.js
      - name: Check Zenith sync API syntax
        run: node --check api/zenith-sync.js
      - name: Check 24/7 engine worker syntax
        run: node --check server/zenith-engine-worker.mjs
      - name: Check Node 24 WebSocket runtime
        run: node -e "if (typeof WebSocket !== 'function') process.exit(1)"
      - name: Test reconciliation failure scenarios
        run: node --test scripts/test-reconcile.mjs
      - name: Test strict real-entry transition model
        run: node --test scripts/test-entry-transition.mjs
      - name: Test reconciliation entry-transition fencing
        run: node --test scripts/test-entry-transition-reconcile-wiring.mjs
      - name: Test fail-closed reconciliation attempt fence
        run: node --test scripts/test-reconciliation-attempt-fence.mjs
      - name: Test orphan protection cleanup safety
        run: node --test scripts/test-orphan-protection-cleanup.mjs
      - name: Test shared MASTER administration
        run: node --test scripts/test-master-admin.mjs
      - name: Test strict PAUSED-only MASTER resume
        run: node --test scripts/test-master-resume-paused-gate.mjs
      - name: Test privileged requester role fences
        run: node --test scripts/test-privileged-requester-role-fence.mjs
      - name: Test atomic PAUSE_PENDING finalization
        run: node --test scripts/test-atomic-pause-finalize.mjs
      - name: Test ADMIN-protected MASTER activation
