name: Zenith Safety Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check secret hygiene
        run: node scripts/check-secret-hygiene.mjs
      - name: Check HTML and safety invariants
        run: node scripts/check-zenith.mjs
      - name: Check Binance read API syntax
        run: node --check api/binance-read.js
      - name: Check Binance reconciliation API syntax
        run: node --check api/binance-reconcile.js
      - name: Check Binance entry preflight API syntax
        run: node --check api/binance-entry-preflight.js
      - name: Check fail-closed Binance entry execution API syntax
        run: node --check api/binance-entry-execute.js
      - name: Check protective execution API syntax
        run: node --check api/binance-protective-execute.js
      - name: Check protective update execution API syntax
        run: node --check api/binance-protective-update-execute.js
      - name: Check Binance user-stream session API syntax
        run: node --check api/binance-user-stream-session.js
      - name: Check Binance runtime snapshot API syntax
        run: node --check api/binance-runtime-snapshot.js
      - name: Check Binance protective test-order API syntax
        run: node --check api/binance-order-test.js
      - name: Check Zenith sync API syntax
        run: node --check api/zenith-sync.js
      - name: Test reconciliation failure scenarios
        run: node --test scripts/test-reconcile.mjs
      - name: Test orphan protection cleanup safety
        run: node --test scripts/test-orphan-protection-cleanup.mjs
      - name: Test shared MASTER administration
        run: node --test scripts/test-master-admin.mjs
      - name: Test MASTER configuration synchronization
        run: node --test scripts/test-master-sync.mjs
      - name: Test iPad MASTER screen wake lock
        run: node --test scripts/test-master-wakelock.mjs
      - name: Test controller-to-MASTER cloud synchronization
        run: node --test scripts/test-cloud-controller-master-sync.mjs
      - name: Test live current price beside determined buy
        run: node --test scripts/test-current-price-reference.mjs
      - name: Test command queue safety
        run: node --test scripts/test-command-safety.mjs
      - name: Test real-entry risk preflight
        run: node --test scripts/test-entry-preflight.mjs
      - name: Test secure device session
        run: node --test scripts/test-device-session.mjs
      - name: Test server-side device session TTL
        run: node --test scripts/test-device-session-server-ttl.mjs
      - name: Test minimal public health disclosure
        run: node --test scripts/test-public-health-minimal.mjs
      - name: Test Vercel browser security headers
        run: node --test scripts/test-vercel-security-headers.mjs
      - name: Test Vercel production-only Binance write gate
        run: node --test scripts/test-vercel-production-write-gate.mjs
      - name: Test deterministic order planning
        run: node --test scripts/test-order-intent.mjs
      - name: Test fail-closed entry protection gate
        run: node --test scripts/test-entry-protection-gate.mjs
      - name: Test central managed emergency hard-cap ACK
        run: node --test scripts/test-central-emergency-cap.mjs
      - name: Test proof-driven entry confirmation
        run: node --test scripts/test-entry-open-state.mjs
      - name: Test MASTER protective command dispatcher
        run: node --test scripts/test-master-command-dispatch.mjs
      - name: Test iPhone real-position close command
        run: node --test scripts/test-controller-real-command.mjs
      - name: Test iPhone real exit and protection commands
        run: node --test scripts/test-controller-protective-command.mjs
      - name: Test strict iPhone protection inventory
        run: node --test scripts/test-controller-protection-inventory.mjs
      - name: Test read-only Binance algo order details
        run: node --test scripts/test-binance-read-algo-details.mjs
      - name: Test Binance read anti-abuse rate limit
        run: node --test scripts/test-binance-read-rate-limit.mjs
      - name: Test idempotent Binance order writer
        run: node --test scripts/test-binance-order-writer.mjs
      - name: Test idempotent Binance algo writer
        run: node --test scripts/test-binance-algo-writer.mjs
      - name: Test protective update order planning
        run: node --test scripts/test-protective-update-intent.mjs
      - name: Test protective update payload safety
        run: node --test scripts/test-protective-command.mjs
      - name: Test automatic real target and max-loss levels
        run: node --test scripts/test-real-protection-levels.mjs
      - name: Test highest-crossed MASTER auto protection
        run: node --test scripts/test-master-auto-protection.mjs
      - name: Test CONTRACT_PRICE alignment for ATTEINT and protections
        run: node --test scripts/test-contract-price-alignment.mjs
      - name: Test autonomous MASTER auto protection wiring
        run: node --test scripts/test-master-auto-protection-wiring.mjs
      - name: Test real protection level wiring
        run: node --test scripts/test-real-protection-level-wiring.mjs
      - name: Test exact missing-protection repair gate
        run: node --test scripts/test-protective-repair-gate.mjs
      - name: Test protective ACK order-leg identity
        run: node --test scripts/test-protective-ack-leg-id.mjs
      - name: Test protective repair wiring
        run: node --test scripts/test-protective-repair-wiring.mjs
      - name: Test protective update conflict guards
        run: node --test scripts/test-protective-update-conflicts.mjs
      - name: Test MAX-LOSS hard-cap wiring
        run: node --test scripts/test-maxloss-hard-cap-wiring.mjs
      - name: Test controller MAX-LOSS UI cap
        run: node --test scripts/test-maxloss-ui-cap.mjs
      - name: Test MASTER command worker routing
        run: node --test scripts/test-master-worker-routing.mjs
      - name: Test idempotent real entry cancellation
        run: node --test scripts/test-binance-order-cancel.mjs
      - name: Test protective execution arm gate
        run: node --test scripts/test-protective-arm-gate.mjs
      - name: Test protective close confirmation and escalation
        run: node --test scripts/test-protective-close-state.mjs
      - name: Test Binance user-stream state machine
        run: node --test scripts/test-user-stream-state.mjs
      - name: Test MASTER stream inventory projection
        run: node --test scripts/test-master-runtime-inventory.mjs
      - name: Test Binance user-stream session lifecycle
        run: node --test scripts/test-user-stream-session.mjs
      - name: Test MASTER REST runtime snapshot
        run: node --test scripts/test-binance-runtime-snapshot.mjs
      - name: Test MASTER REST-to-stream seed
        run: node --test scripts/test-user-stream-seed.mjs
      - name: Test Binance protective order validation without matching-engine submission
        run: node --test scripts/test-binance-order-test.mjs
