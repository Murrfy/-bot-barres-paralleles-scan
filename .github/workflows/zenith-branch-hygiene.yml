name: Zenith Branch Hygiene

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-noop-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete only branches proven safe to remove
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          import { execFileSync } from 'node:child_process';

          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          if (!repo || !token) throw new Error('GitHub workflow credentials unavailable');

          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function githubJson(path) {
            const response = await fetch('https://api.github.com' + path, { headers });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch {}
            if (!response.ok) {
              throw new Error('GitHub API ' + response.status + ' for ' + path + ': ' + text.slice(0, 300));
            }
            return data;
          }

          async function latestMergedHeadsByBranch() {
            const latest = new Map();
            for (let page = 1; ; page += 1) {
              const pulls = await githubJson(
                '/repos/' + repo + '/pulls?state=closed&per_page=100&page=' + page +
                '&sort=updated&direction=desc'
              );
              if (!Array.isArray(pulls) || pulls.length === 0) break;

              for (const pr of pulls) {
                if (!pr?.merged_at) continue;
                if (String(pr?.base?.ref || '') !== 'main') continue;
                if (String(pr?.head?.repo?.full_name || '') !== repo) continue;

                const branch = String(pr?.head?.ref || '');
                const headSha = String(pr?.head?.sha || '');
                if (!branch || !headSha) continue;

                const previous = latest.get(branch);
                if (!previous || Date.parse(pr.merged_at) > Date.parse(previous.mergedAt)) {
                  latest.set(branch, {
                    headSha,
                    mergedAt: pr.merged_at,
                    prNumber: Number(pr.number || 0),
                  });
                }
              }

              if (pulls.length < 100) break;
            }
            return latest;
          }

          const list = execFileSync(
            'git',
            ['for-each-ref', '--format=%(refname:strip=3)', 'refs/remotes/origin/'],
            { encoding: 'utf8' }
          );

          const branches = [...new Set(
            list.split(/\r?\n/)
              .map(v => v.trim())
              .filter(v => v && v !== 'main' && v !== 'HEAD' && v !== 'zenith-work')
          )].sort();

          const mainTree = execFileSync(
            'git',
            ['rev-parse', 'origin/main^{tree}'],
            { encoding: 'utf8' }
          ).trim();

          const mergedHeads = await latestMergedHeadsByBranch();
          console.log('Merged PR branch heads mapped: ' + mergedHeads.size);
          const safe = [];
          const review = [];
          let ancestorSafe = 0;
          let noopMergeSafe = 0;
          let mergedPrUnchangedSafe = 0;
          let tombstoneAfterMergedPrSafe = 0;
          let tombstoneOnlyUniqueSafe = 0;
          let patchEquivalentSafe = 0;
          let patchEquivalentTombstoneSafe = 0;
          let archivedDeadBranchSafe = 0;
          const TOMBSTONE = '00_⛔_BRANCHE_MORTE_NE_PAS_UTILISER.md';
          const ARCHIVE_TAG_PREFIX = 'zenith-legacy/';

          for (const branch of branches) {
            const ref = 'origin/' + branch;

            let hasDeadMarker = false;
            try {
              execFileSync(
                'git',
                ['cat-file', '-e', ref + ':' + TOMBSTONE],
                { stdio: 'ignore' }
              );
              hasDeadMarker = true;
            } catch {}

            if (hasDeadMarker) {
              try {
                const tip = execFileSync(
                  'git',
                  ['rev-parse', ref],
                  { encoding: 'utf8' }
                ).trim();
                const archiveRef = 'refs/tags/' + ARCHIVE_TAG_PREFIX + branch;
                const encodedRef = ('tags/' + ARCHIVE_TAG_PREFIX + branch)
                  .split('/').map(encodeURIComponent).join('/');
                const existing = await fetch(
                  'https://api.github.com/repos/' + repo + '/git/ref/' + encodedRef,
                  { headers }
                );

                if (existing.status === 200) {
                  const data = await existing.json();
                  const archivedSha = String(data?.object?.sha || '');
                  if (archivedSha !== tip) {
                    console.log(
                      'archive conflict: ' + branch +
                      ' existing=' + archivedSha + ' current=' + tip
                    );
                    review.push(branch);
                    continue;
                  }
                } else if (existing.status === 404) {
                  const createResponse = await fetch(
                    'https://api.github.com/repos/' + repo + '/git/refs',
                    {
                      method: 'POST',
                      headers: { ...headers, 'Content-Type': 'application/json' },
                      body: JSON.stringify({ ref: archiveRef, sha: tip }),
                    }
                  );
                  if (createResponse.status !== 201) {
                    const body = await createResponse.text();
                    throw new Error(
                      'Failed archiving ' + branch + ': HTTP ' +
                      createResponse.status + ' ' + body.slice(0, 300)
                    );
                  }
                } else {
                  const body = await existing.text();
                  throw new Error(
                    'Failed checking archive for ' + branch + ': HTTP ' +
                    existing.status + ' ' + body.slice(0, 300)
                  );
                }

                safe.push(branch);
                archivedDeadBranchSafe += 1;
                continue;
              } catch (error) {
                console.log(
                  'archive skipped: ' + branch + ' — ' +
                  String(error?.message || error || 'unknown')
                );
                review.push(branch);
                continue;
              }
            }

            try {
              execFileSync(
                'git',
                ['merge-base', '--is-ancestor', ref, 'origin/main'],
                { stdio: 'ignore' }
              );
              safe.push(branch);
              ancestorSafe += 1;
              continue;
            } catch {}

            try {
              const mergedTree = execFileSync(
                'git',
                ['merge-tree', '--write-tree', 'origin/main', ref],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
              ).trim().split(/\s+/)[0];

              if (mergedTree === mainTree) {
                safe.push(branch);
                noopMergeSafe += 1;
                continue;
              }
            } catch {}

            try {
              const uniqueCommits = execFileSync(
                'git',
                ['rev-list', 'origin/main..' + ref],
                { encoding: 'utf8' }
              ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

              if (uniqueCommits.length > 0) {
                let sawPath = false;
                let tombstoneOnly = true;

                for (const commit of uniqueCommits) {
                  const paths = execFileSync(
                    'git',
                    ['-c', 'core.quotepath=false', 'diff-tree', '-m', '--root', '--no-commit-id', '--name-only', '-r', commit],
                    { encoding: 'utf8' }
                  ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

                  if (paths.length === 0) {
                    tombstoneOnly = false;
                    break;
                  }

                  sawPath = true;
                  if (paths.some(path => path !== TOMBSTONE)) {
                    tombstoneOnly = false;
                    break;
                  }
                }

                if (sawPath && tombstoneOnly) {
                  safe.push(branch);
                  tombstoneOnlyUniqueSafe += 1;
                  continue;
                }
              }
            } catch {}

            try {
              const uniqueMergeCommits = execFileSync(
                'git',
                ['rev-list', '--merges', 'origin/main..' + ref],
                { encoding: 'utf8' }
              ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

              if (uniqueMergeCommits.length === 0) {
                const cherry = execFileSync(
                  'git',
                  ['cherry', 'origin/main', ref],
                  { encoding: 'utf8' }
                ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

                if (cherry.length > 0) {
                  const plusCommits = cherry
                    .filter(line => line.startsWith('+ '))
                    .map(line => line.slice(2).trim())
                    .filter(Boolean);

                  if (plusCommits.length === 0) {
                    safe.push(branch);
                    patchEquivalentSafe += 1;
                    continue;
                  }

                  let plusSawPath = false;
                  let plusTombstoneOnly = true;
                  for (const commit of plusCommits) {
                    const paths = execFileSync(
                      'git',
                      ['-c', 'core.quotepath=false', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', commit],
                      { encoding: 'utf8' }
                    ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

                    if (paths.length === 0) {
                      plusTombstoneOnly = false;
                      break;
                    }

                    plusSawPath = true;
                    if (paths.some(path => path !== TOMBSTONE)) {
                      plusTombstoneOnly = false;
                      break;
                    }
                  }

                  if (plusSawPath && plusTombstoneOnly) {
                    safe.push(branch);
                    patchEquivalentTombstoneSafe += 1;
                    continue;
                  }
                }
              }
            } catch {}

            const merged = mergedHeads.get(branch);
            if (merged) {
              try {
                const tip = execFileSync(
                  'git',
                  ['rev-parse', ref],
                  { encoding: 'utf8' }
                ).trim();

                if (tip === merged.headSha) {
                  safe.push(branch);
                  mergedPrUnchangedSafe += 1;
                  continue;
                }

                execFileSync(
                  'git',
                  ['merge-base', '--is-ancestor', merged.headSha, ref],
                  { stdio: 'ignore' }
                );

                const diff = execFileSync(
                  'git',
                  ['-c', 'core.quotepath=false', 'diff', '--name-status', merged.headSha + '..' + ref],
                  { encoding: 'utf8' }
                ).split(/\r?\n/).map(v => v.trim()).filter(Boolean);

                if (
                  diff.length === 1 &&
                  /^[AM]\s+/.test(diff[0]) &&
                  diff[0].replace(/^[AM]\s+/, '') === TOMBSTONE
                ) {
                  safe.push(branch);
                  tombstoneAfterMergedPrSafe += 1;
                  continue;
                }
              } catch {}
            }

            review.push(branch);
          }

          console.log(
            'Branch classification: total=' + branches.length +
            ' safe=' + safe.length +
            ' ancestorSafe=' + ancestorSafe +
            ' noopMergeSafe=' + noopMergeSafe +
            ' mergedPrUnchangedSafe=' + mergedPrUnchangedSafe +
            ' tombstoneAfterMergedPrSafe=' + tombstoneAfterMergedPrSafe +
            ' tombstoneOnlyUniqueSafe=' + tombstoneOnlyUniqueSafe +
            ' patchEquivalentSafe=' + patchEquivalentSafe +
            ' patchEquivalentTombstoneSafe=' + patchEquivalentTombstoneSafe +
            ' archivedDeadBranchSafe=' + archivedDeadBranchSafe +
            ' review=' + review.length
          );

          let deleted = 0;
          let skipped = 0;

          for (const branch of safe) {
            const encoded = branch.split('/').map(encodeURIComponent).join('/');
            const url = 'https://api.github.com/repos/' + repo + '/git/refs/heads/' + encoded;
            const response = await fetch(url, { method: 'DELETE', headers });

            if (response.status === 204) {
              deleted += 1;
              console.log('deleted: ' + branch);
              continue;
            }

            if (response.status === 404 || response.status === 422) {
              skipped += 1;
              console.log('skipped: ' + branch + ' (HTTP ' + response.status + ')');
              continue;
            }

            const body = await response.text();
            throw new Error('Failed deleting ' + branch + ': HTTP ' + response.status + ' ' + body.slice(0, 300));
          }

          let workBranchSync = 'unchanged';
          try {
            const workRef = 'origin/zenith-work';
            const workSha = execFileSync(
              'git',
              ['rev-parse', workRef],
              { encoding: 'utf8' }
            ).trim();
            const mainSha = execFileSync(
              'git',
              ['rev-parse', 'origin/main'],
              { encoding: 'utf8' }
            ).trim();

            if (workSha !== mainSha) {
              execFileSync(
                'git',
                ['merge-base', '--is-ancestor', workRef, 'origin/main'],
                { stdio: 'ignore' }
              );

              const syncHeaders = {
                ...headers,
                'Content-Type': 'application/json',
              };
              const syncResponse = await fetch(
                'https://api.github.com/repos/' + repo + '/git/refs/heads/zenith-work',
                {
                  method: 'PATCH',
                  headers: syncHeaders,
                  body: JSON.stringify({ sha: mainSha, force: false }),
                }
              );
              if (!syncResponse.ok) {
                const body = await syncResponse.text();
                throw new Error(
                  'Failed syncing zenith-work: HTTP ' +
                  syncResponse.status + ' ' + body.slice(0, 300)
                );
              }
              workBranchSync = 'fast-forwarded';
            }
          } catch (error) {
            workBranchSync = 'skipped';
            console.log(
              'zenith-work sync skipped: ' +
              String(error?.message || error || 'unknown')
            );
          }

          console.log(
            'Branch hygiene complete. deleted=' + deleted +
            ' skipped=' + skipped +
            ' review=' + review.length +
            ' zenithWorkSync=' + workBranchSync
          );
          if (review.length) {
            console.log('Branches still requiring review:');
            for (const branch of review) console.log('review: ' + branch);
          }
          NODE
