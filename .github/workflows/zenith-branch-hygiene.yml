name: Zenith Branch Hygiene

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-fully-merged-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete only branches fully merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          import { execFileSync } from 'node:child_process';

          const repo = process.env.GH_REPOSITORY;
          const token = process.env.GH_TOKEN;
          if (!repo || !token) throw new Error('GitHub workflow credentials unavailable');

          const raw = execFileSync(
            'git',
            ['for-each-ref', '--format=%(refname:strip=3)', '--merged=origin/main', 'refs/remotes/origin/'],
            { encoding: 'utf8' }
          );

          const branches = [...new Set(
            raw.split(/\r?\n/)
              .map(v => v.trim())
              .filter(v => v && v !== 'main' && v !== 'HEAD')
          )].sort();

          console.log(`Fully merged branches eligible for deletion: ${branches.length}`);

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          let deleted = 0;
          let skipped = 0;

          for (const branch of branches) {
            const encoded = branch.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${repo}/git/refs/heads/${encoded}`;
            const response = await fetch(url, { method: 'DELETE', headers });

            if (response.status === 204) {
              deleted += 1;
              console.log(`deleted: ${branch}`);
              continue;
            }

            if (response.status === 404 || response.status === 422) {
              skipped += 1;
              console.log(`skipped: ${branch} (HTTP ${response.status})`);
              continue;
            }

            const body = await response.text();
            throw new Error(`Failed deleting ${branch}: HTTP ${response.status} ${body.slice(0, 300)}`);
          }

          console.log(`Branch hygiene complete. deleted=${deleted} skipped=${skipped}`);
          NODE
