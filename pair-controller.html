<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zenith — Jumelage iPhone</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef6ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07111f}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 48px}
.card{background:#0c1a2b;border:1px solid #29415d;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:30px;margin:0 0 8px}.sub{color:#a9bdd3;margin-bottom:22px;line-height:1.45}
label{display:block;font-weight:700;margin:16px 0 8px}
input{width:100%;font-size:19px;padding:15px 14px;border-radius:14px;border:1px solid #35516f;background:#07111f;color:#fff;outline:none}
button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;background:#16a3c7;color:#041018}
button:disabled{opacity:.5}
.status{margin-top:18px;padding:14px;border-radius:14px;background:#07111f;border:1px solid #29415d;line-height:1.4}
.ok{border-color:#168d5d;color:#9bf0c3}.err{border-color:#a53b3b;color:#ffb1b1}
.small{font-size:13px;color:#9db0c4;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Zenith — iPhone contrôleur</h1>
    <div class="sub">Cette page associe uniquement cet iPhone comme poste de commande. Elle ne peut pas transformer l’iPhone en MASTER.</div>

    <label for="code">Code de jumelage</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ton code secret">

    <button id="pairBtn">Associer cet iPhone</button>

    <div id="status" class="status">Prêt pour le jumelage.</div>
    <div class="small">Le code de jumelage n’est pas conservé. Après validation, Zenith enregistre uniquement un jeton d’appareil propre à cet iPhone.</div>
  </div>
</div>
<script>
const DEVICE_ID_KEY='zenith_device_id_v1';
const DEVICE_TOKEN_KEY='zenith_device_token_v1';
const DEVICE_ROLE_KEY='zenith_device_role_v1';
const DEVICE_NAME_KEY='zenith_device_name_v1';

function deviceId(){
  let id=localStorage.getItem(DEVICE_ID_KEY);
  if(!id){
    id='iphone-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
    localStorage.setItem(DEVICE_ID_KEY,id);
  }
  return id;
}

const $=id=>document.getElementById(id);
const setStatus=(msg,type='')=>{
  const el=$('status');
  el.textContent=msg;
  el.className='status'+(type?' '+type:'');
};

async function pair(){
  const code=$('code').value;
  if(!code){setStatus('Entre ton code de jumelage.','err');return}
  $('pairBtn').disabled=true;
  setStatus('Jumelage en cours…');
  try{
    const r=await fetch('/api/zenith-sync?action=pair',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        pairingCode:code,
        deviceId:deviceId(),
        role:'controller',
        deviceName:'iPhone contrôleur Zenith'
      })
    });
    const q=await r.json().catch(()=>({}));
    if(!r.ok||q?.ok!==true||!q?.token){
      throw new Error(q?.code||q?.error||('HTTP '+r.status));
    }
    localStorage.setItem(DEVICE_TOKEN_KEY,q.token);
    localStorage.setItem(DEVICE_ROLE_KEY,'controller');
    localStorage.setItem(DEVICE_NAME_KEY,'iPhone contrôleur Zenith');
    $('code').value='';
    setStatus('Jumelage réussi. Cet iPhone est maintenant le contrôleur Zenith.','ok');
  }catch(e){
    setStatus('Jumelage refusé : '+(e?.message||'erreur inconnue')+'.','err');
  }finally{
    $('pairBtn').disabled=false;
  }
}
$('pairBtn').addEventListener('click',pair);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')pair()});
</script>
</body>
</html>
